[project]
name = "nesspy-analysis"
version = "0.12.0"
description = "Analyze nesspy output files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "questionary>=2.0.1",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nesspy_analysis"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
