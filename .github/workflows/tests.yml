name: tests

# Run the pytest suite on every push and pull request so we don't silently
# break the analysis package.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv manages the environment (see uv.lock / pyproject.toml).
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Python >= 3.12 as required by pyproject.toml.
      - name: Set up Python
        run: uv python install 3.12

      # Install deps + the editable package exactly as locked.
      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
